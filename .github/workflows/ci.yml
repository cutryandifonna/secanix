name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install gitleaks
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          sudo mv "$RUNNER_TEMP/gitleaks" /usr/local/bin/gitleaks
      - name: Install semgrep
        run: pip install semgrep==1.173.0
      - name: Install osv-scanner
        run: |
          sudo curl -sSfL -o /usr/local/bin/osv-scanner https://github.com/google/osv-scanner/releases/download/v2.5.0/osv-scanner_linux_amd64
          sudo chmod +x /usr/local/bin/osv-scanner
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Dogfood scan (fail on a new critical finding in this repo)
        run: |
          node dist/cli.js --json . | node -e "
            let raw = '';
            process.stdin.on('data', (c) => (raw += c));
            process.stdin.on('end', () => {
              const findings = JSON.parse(raw);
              const critical = findings.filter((f) => f.severity === 'critical');
              if (critical.length > 0) {
                console.error(critical.length + ' critical finding(s) in this repo:');
                for (const f of critical) console.error('  ' + f.file + ':' + f.line + ' — ' + f.description);
                process.exit(1);
              }
              console.log('Dogfood scan clean: ' + findings.length + ' non-critical finding(s), 0 critical.');
            });
          "
